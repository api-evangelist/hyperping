# Vendor facets — Hyperping. Uptime monitoring with hosted status pages; on the Kin Score it touches one
# pointer check, status_page_present (6 pts), and earns it in full: *.hyperping.app pages 404 unknown paths,
# so even a free-plan hosted page clears the pointer-liveness probe. Its MCP server and status.json score nothing.
vendor: hyperping
name: Hyperping
website: https://hyperping.com
areas:
- status-page
registry_keys:
- hyperping
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  Hyperping moves one Kin Score check, status_page_present (6 of 38 operational-transparency points),
  once the provider declares the page as a StatusPage in apis.yml. Unlike several rivals it earns the
  check even on the free plan's hosted subdomain: *.hyperping.app returns a real 404 for nonsense paths,
  so the pointer grades live. Its status.json endpoint, subscriber feeds and MCP server are useful but
  score nothing for the provider.
features:
- id: hosted-status-page
  name: Hosted status page (hyperping subdomain free, custom domain on paid plans)
  description: >-
    Public status pages with component grouping, incidents and scheduled maintenance; free plan on a Hyperping-hosted
    subdomain, custom domains with managed HTTPS on paid plans; private pages on Pro+.
  source: https://hyperping.com/status-page
  tier: all
- id: soft-404-safe-hosting
  name: Real 404 for unknown paths (measured)
  description: >-
    Probed 2026-09-25: plans.hyperping.app and status.hyperping.app return 200 for the page and 404 for
    a nonsense path.
  source: https://plans.hyperping.app
  tier: all
- id: subscribers
  name: Subscribers via email, Slack, Teams, RSS/Atom; SMS via Twilio
  description: Subscribers can follow specific services; channels on paid plans.
  source: https://hyperping.com/status-page
  tier: paid
- id: status-json
  name: Public status.json
  description: Appending /status.json returns the page indicator and 90-day average uptime.
  source: https://hyperping.com/docs/status-page/status-page-json
  tier: all
- id: hyperping-mcp
  name: Hyperping MCP server
  description: MCP server for AI tools to work with the provider's Hyperping monitors and incidents.
  source: https://hyperping.com/status-page
  tier: unknown
maps:
- feature: hosted-status-page
  check: status_page_present
  layer: composite
  credit: 1.0
  provider_must: >-
    Declare the page in apis.yml as common[].type StatusPage; the pointer is liveness-graded and grades
    live.
  note: Binary check, cleared in full on any plan. The only check the status-page area touches.
  catalog_pass_rate: 0.125
  facet: operational_transparency
  points: 6
  baseline_pass_rate: 0.376
earns_nothing:
- feature: hyperping-mcp
  check: mcp_server
  why: >-
    It serves the provider's team their Hyperping monitoring data; the dimension reads an MCP server for
    the provider's own API, described in its mcp/ manifest.
out_of_reach:
  checks:
  - change_log_present
  - deprecation_policy
  - roadmap_present
  - rate_limits_documented
  - webhooks_advertised
  note: A status page publishes nothing about the API's changes, limits, deprecations or own webhooks.
unscored_practice:
- feature: status-json
  why: Machine-readable status and uptime an agent could poll; no check reads it.
- feature: subscribers
  why: RSS/Atom status feeds; unscored.
