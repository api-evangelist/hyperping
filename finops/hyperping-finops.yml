meters:
- name: subscription_tier
  description: Flat monthly or annual subscription fee for the selected plan tier.
  unit: subscription
  aggregation: flat
  dimensions:
  - account
  - plan
- name: additional_seats
  description: Additional Business-plan user seats beyond the included 15, at $12/month each.
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - plan
- name: monitors_used
  description: Monitors in use against the plan's included monitor quota.
  unit: monitors
  aggregation: max
  dimensions:
  - account
  - plan
- name: status_pages_used
  description: Status pages in use against the plan's included status page quota.
  unit: status_pages
  aggregation: max
