principles:
- name: Visibility
  description: Track which plan tier is active and how many monitors, status pages, seats, and browser checks are consumed against quota.
- name: Allocation
  description: Map the single subscription invoice and any additional-seat charges to the owning team or cost center.
- name: Optimization
  description: Pay annually for two months free; right-size the plan tier to actual monitor and seat needs; avoid over-provisioning Business seats.
- name: Accountability
  description: Assign an owner for the Hyperping subscription; review tier and seat count against actual usage each renewal.
