description: >-
  FinOps view of Hyperping spend. Hyperping bills on a flat-rate subscription
  model priced by capacity tier (Free, Essentials, Pro, Business, Enterprise),
  where each tier bundles a fixed number of monitors, status pages, browser
  checks, and seats. Cost is largely fixed and predictable per billing period;
  the main variable charges are additional Business seats ($12/month each) and
  annual-vs-monthly billing (two months free when paid annually).
notes: >-
  Verify current tier prices and included quotas against the Hyperping pricing
  page during reconciliation.
