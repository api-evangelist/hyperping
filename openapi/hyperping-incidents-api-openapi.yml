openapi: 3.2.0
info:
  title: Hyperping Incidents API
  description: Hyperping is an uptime monitoring platform and status page service. This API allows you to programmatically manage monitors, healthchecks, status pages, incidents, outages, maintenance windows, and access uptime reports.
  version: 1.0.0
  contact:
    name: Hyperping Support
    email: hello@hyperping.io
    url: https://hyperping.com
  x-logo:
    url: https://hyperping.com/icons/icon-512x512.png
servers:
- url: https://api.hyperping.io
  description: Production API server
security:
- bearerAuth: []
tags:
- name: Incidents
  description: Status page incident management
paths:
  /v3/incidents:
    get:
      tags:
      - Incidents
      summary: List all incidents
      description: Returns all status page incidents.
      operationId: listIncidents
      responses:
        '200':
          description: List of incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Incident'
    post:
      tags:
      - Incidents
      summary: Create an incident
      description: Creates a new status page incident.
      operationId: createIncident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentCreate'
      responses:
        '201':
          description: Incident created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  uuid:
                    type: string
  /v3/incidents/{uuid}:
    get:
      tags:
      - Incidents
      summary: Get an incident
      operationId: getIncident
      parameters:
      - $ref: '#/components/parameters/IncidentUuid'
      responses:
        '200':
          description: Incident details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
    put:
      tags:
      - Incidents
      summary: Update an incident
      operationId: updateIncident
      parameters:
      - $ref: '#/components/parameters/IncidentUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentCreate'
      responses:
        '200':
          description: Incident updated
    delete:
      tags:
      - Incidents
      summary: Delete an incident
      operationId: deleteIncident
      parameters:
      - $ref: '#/components/parameters/IncidentUuid'
      responses:
        '200':
          description: Incident deleted
  /v3/incidents/{uuid}/updates:
    post:
      tags:
      - Incidents
      summary: Add incident update
      description: Post a timeline update to an incident.
      operationId: addIncidentUpdate
      parameters:
      - $ref: '#/components/parameters/IncidentUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentUpdate'
      responses:
        '200':
          description: Update added
components:
  parameters:
    IncidentUuid:
      name: uuid
      in: path
      required: true
      schema:
        type: string
      description: Incident UUID
      example: inci_cDAqydvnNnyc8D
  schemas:
    LocalizedText:
      type: object
      description: Localized text object with language keys
      properties:
        en:
          type: string
        fr:
          type: string
        de:
          type: string
        ru:
          type: string
        nl:
          type: string
        pl:
          type: string
        se:
          type: string
      example:
        en: We are investigating the issue
        fr: Nous enquêtons sur le problème
    IncidentUpdate:
      type: object
      properties:
        date:
          type: string
          format: date-time
        text:
          $ref: '#/components/schemas/LocalizedText'
        type:
          type: string
          enum:
          - investigating
          - identified
          - update
          - monitoring
          - resolved
    IncidentCreate:
      type: object
      required:
      - title
      - type
      properties:
        title:
          $ref: '#/components/schemas/LocalizedText'
        type:
          type: string
          enum:
          - outage
          - incident
        affectedComponents:
          type: array
          items:
            type: string
        statuspages:
          type: array
          items:
            type: string
        updates:
          type: array
          items:
            $ref: '#/components/schemas/IncidentUpdate'
    Incident:
      type: object
      properties:
        uuid:
          type: string
        title:
          $ref: '#/components/schemas/LocalizedText'
        type:
          type: string
          enum:
          - outage
          - incident
        affectedComponents:
          type: array
          items:
            type: string
        statuspages:
          type: array
          items:
            type: string
        updates:
          type: array
          items:
            $ref: '#/components/schemas/IncidentUpdate'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key from https://app.hyperping.io/project/developers
externalDocs:
  description: Hyperping API Documentation
  url: https://hyperping.com/docs/api/overview
