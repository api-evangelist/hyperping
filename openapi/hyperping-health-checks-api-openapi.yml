openapi: 3.2.0
info:
  title: Hyperping Healthchecks API
  description: Hyperping is an uptime monitoring platform and status page service. This API allows you to programmatically manage monitors, healthchecks, status pages, incidents, outages, maintenance windows, and access uptime reports.
  version: 1.0.0
  contact:
    name: Hyperping Support
    email: hello@hyperping.io
    url: https://hyperping.com
  x-logo:
    url: https://hyperping.com/icons/icon-512x512.png
servers:
- url: https://api.hyperping.io
  description: Production API server
security:
- bearerAuth: []
tags:
- name: Health Checks
  description: Cron job and scheduled task monitoring
paths:
  /v1/healthchecks:
    get:
      tags:
      - Health Checks
      summary: List all healthchecks
      description: Returns all healthcheck monitors for cron job monitoring.
      operationId: listHealthchecks
      responses:
        '200':
          description: List of healthchecks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Healthcheck'
    post:
      tags:
      - Health Checks
      summary: Create a healthcheck
      description: Creates a new healthcheck. Supports simple (periodic interval) and cron (cron expression) modes.
      operationId: createHealthcheck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthcheckCreate'
      responses:
        '201':
          description: Healthcheck created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  healthcheck:
                    $ref: '#/components/schemas/Healthcheck'
  /v1/healthchecks/{uuid}:
    get:
      tags:
      - Health Checks
      summary: Get a healthcheck
      operationId: getHealthcheck
      parameters:
      - $ref: '#/components/parameters/HealthcheckUuid'
      responses:
        '200':
          description: Healthcheck details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Healthcheck'
    put:
      tags:
      - Health Checks
      summary: Update a healthcheck
      operationId: updateHealthcheck
      parameters:
      - $ref: '#/components/parameters/HealthcheckUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthcheckCreate'
      responses:
        '200':
          description: Healthcheck updated
    delete:
      tags:
      - Health Checks
      summary: Delete a healthcheck
      operationId: deleteHealthcheck
      parameters:
      - $ref: '#/components/parameters/HealthcheckUuid'
      responses:
        '200':
          description: Healthcheck deleted
  /v1/healthchecks/{uuid}/pause:
    post:
      tags:
      - Health Checks
      summary: Pause a healthcheck
      description: Temporarily pause monitoring and alerting.
      operationId: pauseHealthcheck
      parameters:
      - $ref: '#/components/parameters/HealthcheckUuid'
      responses:
        '200':
          description: Healthcheck paused
  /v1/healthchecks/{uuid}/resume:
    post:
      tags:
      - Health Checks
      summary: Resume a healthcheck
      description: Resume a paused healthcheck.
      operationId: resumeHealthcheck
      parameters:
      - $ref: '#/components/parameters/HealthcheckUuid'
      responses:
        '200':
          description: Healthcheck resumed
components:
  schemas:
    Healthcheck:
      type: object
      properties:
        uuid:
          type: string
          example: tok_abc123def456
        publicUuid:
          type: string
          readOnly: true
          description: Public identifier (hc_). Use it to show the healthcheck on a status page. Unlike uuid, which is also the token of the ping URL, it is safe to share.
          example: hc_Kq3vX9mPzL2wR8tY5nB7cD4f
        name:
          type: string
          example: Daily Backup Job
        pingUrl:
          type: string
          example: https://hc.hyperping.io/tok_abc123def456
        period:
          type: integer
          description: Expected interval in seconds
        periodValue:
          type:
          - integer
          - 'null'
        periodType:
          type:
          - string
          - 'null'
          enum:
          - seconds
          - minutes
          - hours
          - days
        gracePeriod:
          type: integer
          description: Grace period in seconds
        gracePeriodValue:
          type: integer
        gracePeriodType:
          type: string
          enum:
          - seconds
          - minutes
          - hours
          - days
        cron:
          type:
          - string
          - 'null'
          example: 0 2 * * *
        timezone:
          type: string
          example: America/New_York
    HealthcheckCreate:
      type: object
      required:
      - name
      - grace_period_value
      - grace_period_type
      properties:
        name:
          type: string
          example: Daily Backup Job
        period_value:
          type: integer
          description: Expected ping interval (simple mode)
        period_type:
          type: string
          enum:
          - seconds
          - minutes
          - hours
          - days
        grace_period_value:
          type: integer
          example: 5
        grace_period_type:
          type: string
          enum:
          - seconds
          - minutes
          - hours
          - days
        cron:
          type: string
          description: Cron expression (cron mode)
          example: 0 2 * * *
        timezone:
          type: string
          default: UTC
  parameters:
    HealthcheckUuid:
      name: uuid
      in: path
      required: true
      schema:
        type: string
      description: Healthcheck UUID
      example: tok_abc123def456
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key from https://app.hyperping.io/project/developers
externalDocs:
  description: Hyperping API Documentation
  url: https://hyperping.com/docs/api/overview
