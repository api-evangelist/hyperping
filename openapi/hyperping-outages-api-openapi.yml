openapi: 3.2.0
info:
  title: Hyperping Outages API
  description: Hyperping is an uptime monitoring platform and status page service. This API allows you to programmatically manage monitors, healthchecks, status pages, incidents, outages, maintenance windows, and access uptime reports.
  version: 1.0.0
  contact:
    name: Hyperping Support
    email: hello@hyperping.io
    url: https://hyperping.com
  x-logo:
    url: https://hyperping.com/icons/icon-512x512.png
servers:
- url: https://api.hyperping.io
  description: Production API server
security:
- bearerAuth: []
tags:
- name: Outages
  description: Detected downtime events and manual incidents
paths:
  /v2/outages:
    get:
      tags:
      - Outages
      summary: List all outages
      description: Returns a paginated list of detected outages.
      operationId: listOutages
      parameters:
      - name: page
        in: query
        schema:
          type: number
          default: 0
        description: Page number (0-indexed)
      - name: status
        in: query
        schema:
          type: string
          enum:
          - all
          - ongoing
          - resolved
          default: all
        description: Filter by outage status
      - name: type
        in: query
        schema:
          type: string
          enum:
          - all
          - manual
          - monitor
          default: all
        description: Filter by outage type
      - name: search
        in: query
        schema:
          type: string
        description: Search by description or incident number (e.g. INC-123)
      responses:
        '200':
          description: List of outages
          content:
            application/json:
              schema:
                type: object
                properties:
                  outages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Outage'
                  hasNextPage:
                    type: boolean
                  total:
                    type: number
                  ongoingCount:
                    type: number
                  page:
                    type: number
                  resultsPerPage:
                    type: number
    post:
      tags:
      - Outages
      summary: Create a manual incident
      description: Creates a manual incident that can trigger escalation policies.
      operationId: createOutage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutageCreate'
      responses:
        '200':
          description: Incident created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  outage:
                    $ref: '#/components/schemas/Outage'
  /v2/outages/{uuid}:
    get:
      tags:
      - Outages
      summary: Get an outage
      operationId: getOutage
      parameters:
      - $ref: '#/components/parameters/OutageUuid'
      responses:
        '200':
          description: Outage details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Outage'
    delete:
      tags:
      - Outages
      summary: Delete an outage
      operationId: deleteOutage
      parameters:
      - $ref: '#/components/parameters/OutageUuid'
      responses:
        '200':
          description: Outage deleted
  /v2/outages/{uuid}/acknowledge:
    post:
      tags:
      - Outages
      summary: Acknowledge an outage
      description: Acknowledge an outage to stop further escalation notifications.
      operationId: acknowledgeOutage
      parameters:
      - $ref: '#/components/parameters/OutageUuid'
      responses:
        '200':
          description: Outage acknowledged
  /v2/outages/{uuid}/unacknowledge:
    post:
      tags:
      - Outages
      summary: Unacknowledge an outage
      description: Remove acknowledgment to resume escalation alerts.
      operationId: unacknowledgeOutage
      parameters:
      - $ref: '#/components/parameters/OutageUuid'
      responses:
        '200':
          description: Acknowledgment removed
  /v2/outages/{uuid}/resolve:
    post:
      tags:
      - Outages
      summary: Resolve an outage
      description: Mark an outage as resolved.
      operationId: resolveOutage
      parameters:
      - $ref: '#/components/parameters/OutageUuid'
      responses:
        '200':
          description: Outage resolved
  /v2/outages/{uuid}/escalate:
    post:
      tags:
      - Outages
      summary: Escalate an outage
      description: Manually escalate to the next level in your escalation policy.
      operationId: escalateOutage
      parameters:
      - $ref: '#/components/parameters/OutageUuid'
      responses:
        '200':
          description: Outage escalated
components:
  parameters:
    OutageUuid:
      name: uuid
      in: path
      required: true
      schema:
        type: string
      description: Outage UUID
      example: outage_abc123
  schemas:
    OutageCreate:
      type: object
      required:
      - description
      properties:
        description:
          type: string
          example: Database maintenance in progress
        escalationPolicyUuid:
          type: string
          description: UUID of escalation policy to trigger
        severity:
          type: string
          enum:
          - critical
          - major
          - minor
          default: minor
          description: Severity level of the incident
        summary:
          type: string
          description: Initial summary for the incident (rich text)
    Outage:
      type: object
      properties:
        uuid:
          type: string
          example: outage_abc123
        startDate:
          type: string
          format: date-time
        endDate:
          type:
          - string
          - 'null'
          format: date-time
        durationMs:
          type: number
          description: Duration in milliseconds
        statusCode:
          type: number
          example: 500
        description:
          type: string
        isResolved:
          type: boolean
        detectedLocation:
          type: string
          example: paris
        confirmedLocations:
          type: string
          example: paris,london,frankfurt
        protocol:
          type: string
          example: http
        severity:
          type: string
          enum:
          - critical
          - major
          - minor
          default: minor
        incidentNumber:
          type:
          - number
          - 'null'
          description: Auto-incrementing per-project incident number
        acknowledgedAt:
          type:
          - string
          - 'null'
          format: date-time
        acknowledgedBy:
          type:
          - object
          - 'null'
          properties:
            uuid:
              type: string
            email:
              type: string
            name:
              type: string
        reportedBy:
          type:
          - object
          - 'null'
          description: User who reported the incident (manual incidents only)
          properties:
            uuid:
              type: string
            email:
              type: string
            name:
              type: string
        monitor:
          type:
          - object
          - 'null'
          properties:
            uuid:
              type: string
            name:
              type: string
            url:
              type: string
            protocol:
              type: string
        escalationPolicy:
          type:
          - object
          - 'null'
          properties:
            uuid:
              type: string
            name:
              type: string
            alertedSteps:
              type: number
            totalSteps:
              type: number
        summary:
          type:
          - string
          - 'null'
          description: User-written summary (rich text)
        aiSummary:
          type:
          - string
          - 'null'
          description: AI-generated summary
        postmortem:
          type:
          - string
          - 'null'
          description: Post-mortem analysis (rich text)
        escalationPolicyUuid:
          type:
          - string
          - 'null'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key from https://app.hyperping.io/project/developers
externalDocs:
  description: Hyperping API Documentation
  url: https://hyperping.com/docs/api/overview
