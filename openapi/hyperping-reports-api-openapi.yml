openapi: 3.2.0
info:
  title: Hyperping Reports API
  description: Hyperping is an uptime monitoring platform and status page service. This API allows you to programmatically manage monitors, healthchecks, status pages, incidents, outages, maintenance windows, and access uptime reports.
  version: 1.0.0
  contact:
    name: Hyperping Support
    email: hello@hyperping.io
    url: https://hyperping.com
  x-logo:
    url: https://hyperping.com/icons/icon-512x512.png
servers:
- url: https://api.hyperping.io
  description: Production API server
security:
- bearerAuth: []
tags:
- name: Reports
  description: Uptime and performance reports
paths:
  /v2/reporting/monitor-reports:
    get:
      tags:
      - Reports
      summary: List all reports
      description: Returns uptime reports for all monitors.
      operationId: listReports
      responses:
        '200':
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportSummary'
  /v2/reporting/monitor-reports/{uuid}:
    get:
      tags:
      - Reports
      summary: Get monitor report
      description: Returns detailed SLA, MTTR, and outage data for a specific monitor.
      operationId: getReport
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
        description: Monitor UUID
        example: mon_wq1sFyHbxC7YRC
      - name: from
        in: query
        schema:
          type: string
          format: date-time
        description: Start date (ISO 8601). Defaults to 7 days ago.
      - name: to
        in: query
        schema:
          type: string
          format: date-time
        description: End date (ISO 8601). Defaults to now.
      responses:
        '200':
          description: Detailed report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
components:
  schemas:
    Report:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        protocol:
          type: string
        period:
          type: object
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        sla:
          type: number
          example: 99.184
        outages:
          type: object
          properties:
            count:
              type: integer
            totalDowntime:
              type: integer
              description: Seconds
            totalDowntimeFormatted:
              type: string
            longestOutage:
              type: integer
            longestOutageFormatted:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  startDate:
                    type: string
                    format: date-time
                  endDate:
                    type: string
                    format: date-time
                  duration:
                    type: integer
                  durationFormatted:
                    type: string
        mttr:
          type: integer
          description: Mean Time To Recovery in seconds
        mttrFormatted:
          type: string
    ReportSummary:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        sla:
          type: number
          description: Uptime percentage
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key from https://app.hyperping.io/project/developers
externalDocs:
  description: Hyperping API Documentation
  url: https://hyperping.com/docs/api/overview
x-provenance:
  method: harvested
  publisher: Hyperping
  source: https://hyperping.com/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
