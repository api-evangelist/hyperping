openapi: 3.2.0
info:
  title: Hyperping Maintenance API
  description: Hyperping is an uptime monitoring platform and status page service. This API allows you to programmatically manage monitors, healthchecks, status pages, incidents, outages, maintenance windows, and access uptime reports.
  version: 1.0.0
  contact:
    name: Hyperping Support
    email: hello@hyperping.io
    url: https://hyperping.com
  x-logo:
    url: https://hyperping.com/icons/icon-512x512.png
servers:
- url: https://api.hyperping.io
  description: Production API server
security:
- bearerAuth: []
tags:
- name: Maintenance
  description: Scheduled maintenance windows
paths:
  /v1/maintenance-windows:
    get:
      tags:
      - Maintenance
      summary: List maintenance windows
      operationId: listMaintenance
      responses:
        '200':
          description: List of maintenance windows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceWindow'
    post:
      tags:
      - Maintenance
      summary: Create a maintenance window
      description: Schedule a maintenance window to suppress alerts.
      operationId: createMaintenance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceCreate'
      responses:
        '201':
          description: Maintenance window created
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
  /v1/maintenance-windows/{uuid}:
    get:
      tags:
      - Maintenance
      summary: Get a maintenance window
      operationId: getMaintenance
      parameters:
      - $ref: '#/components/parameters/MaintenanceUuid'
      responses:
        '200':
          description: Maintenance window details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceWindow'
    put:
      tags:
      - Maintenance
      summary: Update a maintenance window
      operationId: updateMaintenance
      parameters:
      - $ref: '#/components/parameters/MaintenanceUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceCreate'
      responses:
        '200':
          description: Maintenance window updated
    delete:
      tags:
      - Maintenance
      summary: Delete a maintenance window
      operationId: deleteMaintenance
      parameters:
      - $ref: '#/components/parameters/MaintenanceUuid'
      responses:
        '200':
          description: Maintenance window deleted
components:
  schemas:
    LocalizedText:
      type: object
      description: Localized text object with language keys
      properties:
        en:
          type: string
        fr:
          type: string
        de:
          type: string
        ru:
          type: string
        nl:
          type: string
        pl:
          type: string
        se:
          type: string
      example:
        en: We are investigating the issue
        fr: Nous enquêtons sur le problème
    MaintenanceCreate:
      type: object
      required:
      - name
      - start_date
      - end_date
      - monitors
      properties:
        name:
          type: string
          example: Scheduled Database Maintenance
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        monitors:
          type: array
          items:
            type: string
        statuspages:
          type: array
          items:
            type: string
        title:
          $ref: '#/components/schemas/LocalizedText'
        updates:
          type: array
          items:
            type: object
            properties:
              text:
                $ref: '#/components/schemas/LocalizedText'
              date:
                type: string
                format: date-time
        notificationOption:
          type: string
          enum:
          - none
          - immediate
          - scheduled
          default: none
        notificationMinutes:
          type: integer
          default: 60
    MaintenanceWindow:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        monitors:
          type: array
          items:
            type: string
        statuspages:
          type: array
          items:
            type: string
        title:
          $ref: '#/components/schemas/LocalizedText'
  parameters:
    MaintenanceUuid:
      name: uuid
      in: path
      required: true
      schema:
        type: string
      description: Maintenance window UUID
      example: mw_ot0dguXcrUnB2b
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key from https://app.hyperping.io/project/developers
externalDocs:
  description: Hyperping API Documentation
  url: https://hyperping.com/docs/api/overview
x-provenance:
  method: harvested
  publisher: Hyperping
  source: https://hyperping.com/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
