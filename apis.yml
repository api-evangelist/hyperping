    type: OpenAPI
  - url: collections/hyperping.postman_collection.json
    type: PostmanCollection
  - url: collections/hyperping.opencollection.json
    type: OpenCollection
  description: Public machine-readable status feed exposing a status page's overall
    status indicator plus per-service operational state and uptime via the
    /{subdomain}/status.json endpoint for dashboards and internal tooling.
- aid: hyperping:incidents
  name: Hyperping Incidents API
  tags:
