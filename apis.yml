name: Hyperping
kind: company
description: Hyperping is an uptime monitoring and status page platform. Its REST API
  lets teams programmatically manage HTTP, ping, port, keyword, DNS, and browser
  monitors, run scheduled-task healthchecks, operate public status pages through
  incidents and maintenance windows, manage on-call outages, and pull uptime and
  SLA reporting.
