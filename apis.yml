    type: Documentation
  - url: https://hyperping.com/docs/api/monitors
    type: APIReference
  - url: openapi/hyperping-openapi.yml
    type: OpenAPI
  - url: collections/hyperping.postman_collection.json
    type: PostmanCollection
  - url: collections/hyperping.opencollection.json
    type: OpenCollection
  description: Programmatically create, list, retrieve, update, and delete HTTP, ping,
    port, keyword, DNS, and browser monitors, plus cron-style healthchecks for
    scheduled tasks and background jobs, and pull uptime / SLA / MTTR reporting.
