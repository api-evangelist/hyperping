aid: hyperping
url: https://raw.githubusercontent.com/api-evangelist/hyperping/refs/heads/main/apis.yml
name: Hyperping
kind: company
description: Hyperping is an uptime monitoring and status page platform. Its REST API
  lets teams programmatically manage HTTP, ping, port, keyword, DNS, and browser
  monitors, run scheduled-task healthchecks, operate public status pages through
  incidents and maintenance windows, manage on-call outages, and pull uptime and
  SLA reporting.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Uptime Monitoring
- Status Pages
- Incident Management
- Observability
- On-Call
created: '2026-06-21'
modified: '2026-06-21'
specificationVersion: '0.19'
