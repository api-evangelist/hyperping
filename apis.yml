    type: Documentation
  - url: https://hyperping.com/docs/api/incidents
    type: APIReference
  - url: openapi/hyperping-openapi.yml
    type: OpenAPI
  - url: collections/hyperping.postman_collection.json
    type: PostmanCollection
  - url: collections/hyperping.opencollection.json
    type: OpenCollection
  description: Manage the full incident lifecycle on status pages (investigating,
    identified, monitoring, resolved) with threaded updates, schedule and complete
    maintenance windows, and acknowledge, resolve, or escalate on-call outages.
- aid: hyperping:webhooks
  name: Hyperping Webhooks
