- aid: hyperping:monitors
  name: Hyperping Monitors API
  tags:
  - Monitors
  - Uptime Monitoring
  - Healthchecks
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
